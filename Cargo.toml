[workspace]
members = [
    "crates/godot_bridge",
    "crates/match_core",
    "crates/match_runtime",
    "crates/simulator",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
match_core = { path = "crates/match_core" }
match_runtime = { path = "crates/match_runtime" }

[workspace.lints.clippy]
all = "deny"
